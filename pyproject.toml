[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastkpop"
version = "0.1.0"
description = "An open-source Python toolkit for exploring K-pop industry data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fastkpop contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
fastkpop-fetch = "fastkpop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastkpop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
